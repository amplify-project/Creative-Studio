# Redis settings that are not secret.
#
# The password is NOT here. It is passed as --requirepass on the command line
# by server/docker-compose.yaml, which reads REDIS_PASSWORD from server/.env;
# a command-line option overrides the conf file. This file does not expand
# ${VAR}, so a password written here could not be kept in step with the one
# the ingress and LiveKit use, and the mismatch would only show up at runtime.
