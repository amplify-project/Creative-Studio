# Generated at container start — do NOT edit, and do not put a real config here.
#
# The nginx service's entrypoint runs gomplate over
# `server/nginx/templates/nginx.conf.template` and writes the result over this
# file, so anything written here is overwritten on the next `docker compose up`.
# Edit the template instead.
#
# This placeholder is kept in the repository only so the bind mount in
# `server/docker-compose.yaml` has a file to attach to: if the path does not
# exist, Docker creates a directory there and nginx fails to start.
