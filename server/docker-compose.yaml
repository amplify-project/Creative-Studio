version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    # --requirepass on the command line overrides the conf file, so the
    # password lives in server/.env only. It used to be a literal in
    # redis/redis.conf as well, and that file does NOT expand ${VAR}: leaving
    # it parameterised there would have meant redis demanding one password
    # while the ingress sent another.
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match the redis password in server/server.yaml}
    network_mode: host

  livekit:
    image: livekit/livekit-server
    command: --config /config/livekit.yaml --node-ip=${NODE_IP:-127.0.0.1}
    volumes:
      - ./server.yaml:/config/livekit.yaml
    depends_on:
      - redis
    network_mode: host

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /var/www/html:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot   # <-- para ACME challenge
      - ./certbot/certs:/etc/letsencrypt # <-- certificados para nginx

    healthcheck:
      test: ["CMD", "ls"]
      interval: 15s
      timeout: 3s
      retries: 2  
    environment:
      NODE_IP: ${NODE_IP}  # definir en .env o export
    # Renders nginx.conf from the template at start. The rendered file stays
    # INSIDE the container: it used to be bind-mounted back to
    # server/nginx/nginx.conf, which meant a generated artifact was tracked in
    # git, went stale, and carried the deployment's public IP into the repo.
    entrypoint: ["/bin/sh", "-c", "apt-get update && apt-get install -y wget && wget -O /usr/local/bin/gomplate https://github.com/hairyhenderson/gomplate/releases/download/v4.3.3/gomplate_linux-amd64 && chmod +x /usr/local/bin/gomplate && gomplate -f /etc/nginx/templates/nginx.conf.template -o /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    depends_on:
      - livekit
    network_mode: host

  livekit-ingress:
    image: livekit/ingress
    command: /ingress --config /config.yaml
    volumes:
      - ./ingress/config.yaml:/config.yaml:ro
    environment:
      INGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: ${LIVEKIT_API_KEY:?must match server/server.yaml}
        api_secret: ${LIVEKIT_API_SECRET:?must match server/server.yaml}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
          password: ${REDIS_PASSWORD:?must match the redis password in server/server.yaml}
    depends_on:
      - livekit
      - redis
    network_mode: host

  agent_zoom:
    build:
      context: ./agents
    image: agent_zoom:latest
    container_name: agent_zoom
    restart: unless-stopped
    volumes:
      - ./agents:/app  
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  shared_state:
    build:
      context: ./agents/shareState
    image: agent_shared_state:latest
    container_name: agent_shared_state
    restart: unless-stopped
    volumes:
      - ./agents/shareState:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  assistant_host:
    build:
      context: ./agents/assistantHost
    image: agent_assistant_host:latest
    container_name: agent_assistant_host
    restart: unless-stopped
    volumes:
      - ./agents/assistantHost:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
      - shared_state
    network_mode: host
  mongo:
    build:
      context: ./mongo
    image: mongo_portable:latest
    container_name: mongo1_portable
    hostname: mongo1
    command: ["--replSet", "rs0", "--keyFile", "/data/keyfile", "--auth"]
    volumes:
      - ./data1:/data/db
    ports:
      - "27017:27017"
  webapp:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:?the URL the app is served from}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?generate with openssl rand -base64 32}
        GOOGLE_ID: ${GOOGLE_ID}
        GOOGLE_SECRET: ${GOOGLE_SECRET}
        # Unguarded on purpose, like the Google pair above: .env.example says a
        # blank provider is how you turn that provider off. These two were
        # declared ARG in the Dockerfile but never passed here, so GitHub
        # sign-in could not work in the Docker stack at all.
        GITHUB_ID: ${GITHUB_ID}
        GITHUB_SECRET: ${GITHUB_SECRET}
        LIVEKIT_URL: ${LIVEKIT_URL:?the LiveKit websocket URL}
        LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?must match server/server.yaml}
        LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?must match server/server.yaml}
        ADMIN_EMAIL: ${ADMIN_EMAIL:?the bootstrap administrator account}
        DATABASE_URL : ${DATABASE_URL:?the MongoDB connection string}
        INVITE_JWT_SECRET: ${INVITE_JWT_SECRET:?generate with openssl rand -base64 32}
        APP_BASE_URL: ${APP_BASE_URL:?the URL invitation links point at}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?the LiveKit websocket URL the browser uses}
        NEXT_PUBLIC_NODE_IP: ${NEXT_PUBLIC_NODE_IP:?the host IP the browser reaches}
    image: webapp:latest
    container_name: webapp
    restart: unless-stopped
    environment:
      NODE_ENV: production
    volumes:
      - ./data/bugs:/app/server/data1/bugs
    depends_on:
      - redis
      - livekit
      - mongo
    command: >
        sh -c "
          echo 'Esperando a que Mongo esté escuchando en 27017...' &&
          until nc -z localhost 27017; do sleep 3; done &&
          echo 'Puerto disponible. Ejecutando Prisma...' &&
          npx prisma db push --schema=./app/dbbackend/model/schema.prisma &&
          echo 'Iniciando la webapp...' &&
          npm start
        "
    network_mode: host
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/certs:/etc/letsencrypt
    command: >
      certonly --webroot -w /var/www/certbot
      -d creativestudio.amplifyproject.eu
      --non-interactive --agree-tos -m tu-correo@dominio.com

    depends_on:
      nginx:
        condition: service_healthy

volumes:
  redis-data:
