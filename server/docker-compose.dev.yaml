version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    # --requirepass on the command line overrides the conf file, so the
    # password lives in server/.env only. It used to be a literal in
    # redis/redis.conf as well, and that file does NOT expand ${VAR}: leaving
    # it parameterised there would have meant redis demanding one password
    # while the ingress sent another.
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must match the redis password in server/server.yaml}
    network_mode: host

  livekit:
    image: livekit/livekit-server
    command: --dev --bind 0.0.0.0 --config /config/livekit.yaml --node-ip=192.168.1.52
    volumes:
      - ./server.yaml:/config/livekit.yaml
    depends_on:
      - redis
    network_mode: host

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # nginx needs exactly one variable: NODE_IP, which the template renders into
    # the /ingress/ proxy_pass. A block of 14 more used to sit here —
    # NEXTAUTH_SECRET, the OAuth pairs, LIVEKIT_API_SECRET, DATABASE_URL and the
    # rest — injected into an nginx container that has never read any of them.
    # Removed deliberately: dead configuration, and handing secrets to a process
    # with no use for them is its own small risk.
    environment:
      NODE_IP: ${NODE_IP:?the host IP nginx proxies the ingress to}
    # Renders nginx.conf from the template at start. The rendered file stays
    # INSIDE the container: it used to be bind-mounted back to
    # server/nginx/nginx.conf, which meant a generated artifact was tracked in
    # git, went stale, and carried the deployment's public IP into the repo.
    entrypoint: ["/bin/sh", "-c", "apt-get update && apt-get install -y wget && wget -O /usr/local/bin/gomplate https://github.com/hairyhenderson/gomplate/releases/download/v4.3.3/gomplate_linux-amd64 && chmod +x /usr/local/bin/gomplate && gomplate -f /etc/nginx/templates/nginx.conf.template -o /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    depends_on:
      - livekit
    network_mode: host

  livekit-ingress:
    image: livekit/ingress
    command: /ingress --config /config.yaml
    volumes:
      - ./ingress/config.yaml:/config.yaml:ro
    environment:
      INGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: ${LIVEKIT_API_KEY:?must match server/server.yaml}
        api_secret: ${LIVEKIT_API_SECRET:?must match server/server.yaml}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
          password: ${REDIS_PASSWORD:?must match the redis password in server/server.yaml}
    depends_on:
      - livekit
      - redis
    network_mode: host

  agent_zoom:
    build:
      context: ./agents
    image: agent_zoom:latest
    container_name: agent_zoom
    restart: unless-stopped
    volumes:
      - ./agents:/app  
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  shared_state:
    build:
      context: ./agents/shareState
    image: agent_shared_state:latest
    container_name: agent_shared_state
    restart: unless-stopped
    volumes:
      - ./agents/shareState:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  assistant_host:
    build:
      context: ./agents/assistantHost
    image: agent_assistant_host:latest
    container_name: agent_assistant_host
    restart: unless-stopped
    volumes:
      - ./agents/assistantHost:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?must match server/server.yaml}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?must match server/server.yaml}"
      LIVEKIT_URL: "ws://localhost:7880"
      # Diagnosing why clipping never fires on real room audio: this logs
      # avg_rms (a full-scale clipped signal should read ~0.6-0.7 — a low value
      # means something in the capture path is attenuating before the analyser)
      # and the full per-class distortion_probabilities vector, in
      # [clipping, bw_limit, bass_boost, codec, packet_loss] order.
      # ENABLE_AUDIO_DEBUG auto-enables ENABLE_ANALYZER_DEBUG in the plugin.
      # Chatty — every window. Turn both off once the puzzle is settled.
      ENABLE_AUDIO_DEBUG: "true"
      ANALYZER_DEBUG_EVERY_N_WINDOWS: "1"
    depends_on:
      - livekit
      - shared_state
    network_mode: host
  mongo:
    build:
      context: ./mongo
    image: mongo_portable:latest
    container_name: mongo1_portable
    hostname: mongo1
    command: ["--replSet", "rs0", "--keyFile", "/data/keyfile", "--auth"]
    volumes:
      - ./data1:/data/db
    ports:
      - "27017:27017"

volumes:
  redis-data:
  mongo_data:
