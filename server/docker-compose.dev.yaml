version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    network_mode: host

  livekit:
    image: livekit/livekit-server
    command: --dev --bind 0.0.0.0 --config /config/livekit.yaml --node-ip=192.168.1.52
    volumes:
      - ./server.yaml:/config/livekit.yaml
    depends_on:
      - redis
    network_mode: host

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        GOOGLE_ID: ${GOOGLE_ID}
        GOOGLE_SECRET: ${GOOGLE_SECRET}
        LIVEKIT_URL: ${LIVEKIT_URL}
        LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
        LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
        DATABASE_URL : ${DATABASE_URL}
        INVITE_JWT_SECRET: ${INVITE_JWT_SECRET}
        APP_BASE_URL: ${APP_BASE_URL}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_NODE_IP: ${NEXT_PUBLIC_NODE_IP}
    depends_on:
      - livekit
    network_mode: host

  livekit-ingress:
    image: livekit/ingress
    command: /ingress --config /config.yaml
    volumes:
      - ./ingress/config.yaml:/config.yaml:ro
    environment:
      INGRESS_CONFIG_BODY: |
        log_level: debug
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
          password: ${REDIS_PASSWORD}
    depends_on:
      - livekit
      - redis
    network_mode: host

  agent_zoom:
    build:
      context: ./agents
    image: agent_zoom:latest
    container_name: agent_zoom
    restart: unless-stopped
    volumes:
      - ./agents:/app  
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  shared_state:
    build:
      context: ./agents/shareState
    image: agent_shared_state:latest
    container_name: agent_shared_state
    restart: unless-stopped
    volumes:
      - ./agents/shareState:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - livekit
    network_mode: host
  assistant_host:
    build:
      context: ./agents/assistantHost
    image: agent_assistant_host:latest
    container_name: agent_assistant_host
    restart: unless-stopped
    volumes:
      - ./agents/assistantHost:/app
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_URL: "ws://localhost:7880"
      # Diagnosing why clipping never fires on real room audio: this logs
      # avg_rms (a full-scale clipped signal should read ~0.6-0.7 — a low value
      # means something in the capture path is attenuating before the analyser)
      # and the full per-class distortion_probabilities vector, in
      # [clipping, bw_limit, bass_boost, codec, packet_loss] order.
      # ENABLE_AUDIO_DEBUG auto-enables ENABLE_ANALYZER_DEBUG in the plugin.
      # Chatty — every window. Turn both off once the puzzle is settled.
      ENABLE_AUDIO_DEBUG: "true"
      ANALYZER_DEBUG_EVERY_N_WINDOWS: "1"
    depends_on:
      - livekit
      - shared_state
    network_mode: host
  mongo:
    build:
      context: ./mongo
    image: mongo_portable:latest
    container_name: mongo1_portable
    hostname: mongo1
    command: ["--replSet", "rs0", "--keyFile", "/data/keyfile", "--auth"]
    volumes:
      - ./data1:/data/db
    ports:
      - "27017:27017"

volumes:
  redis-data:
  mongo_data:
